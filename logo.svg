<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&amp;family=Montserrat:wght@300&amp;display=swap');
    </style>
  </defs>

  <!-- Crown -->
  <g transform="translate(160, 18)">
    <!-- Center point -->
    <line x1="0" y1="-18" x2="0" y2="6" stroke="#b8963e" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Left point -->
    <line x1="-22" y1="-10" x2="-22" y2="6" stroke="#b8963e" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Right point -->
    <line x1="22" y1="-10" x2="22" y2="6" stroke="#b8963e" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Left arc: left point to center -->
    <path d="M -22,6 Q -11,-2 0,6" fill="none" stroke="#b8963e" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Right arc: center to right point -->
    <path d="M 0,6 Q 11,-2 22,6" fill="none" stroke="#b8963e" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Base line -->
    <line x1="-30" y1="6" x2="30" y2="6" stroke="#b8963e" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Left diagonal: bottom-left to left point -->
    <line x1="-30" y1="6" x2="-22" y2="-10" stroke="#b8963e" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Right diagonal: right point to bottom-right -->
    <line x1="22" y1="-10" x2="30" y2="6" stroke="#b8963e" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Small dots at tips -->
    <circle cx="0" cy="-18" r="1.8" fill="#b8963e"/>
    <circle cx="-22" cy="-10" r="1.4" fill="#b8963e"/>
    <circle cx="22" cy="-10" r="1.4" fill="#b8963e"/>
  </g>

  <!-- AGUILAR wordmark -->
  <text
    x="160"
    y="90"
    text-anchor="middle"
    font-family="'Cormorant Garamond', 'Garamond', Georgia, serif"
    font-size="38"
    font-weight="300"
    letter-spacing="14"
    fill="#b8963e"
  >AGUILAR</text>

  <!-- BOUTIQUE subtext -->
  <text
    x="162"
    y="118"
    text-anchor="middle"
    font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif"
    font-size="7.5"
    font-weight="300"
    letter-spacing="7"
    fill="#b8963e"
    opacity="0.8"
  >BOUTIQUE</text>

  <!-- Thin rule lines flanking BOUTIQUE -->
  <line x1="60" y1="118" x2="108" y2="118" stroke="#b8963e" stroke-width="0.5" opacity="0.5"/>
  <line x1="212" y1="118" x2="260" y2="118" stroke="#b8963e" stroke-width="0.5" opacity="0.5"/>
</svg>
